name: Build UI
on:
  push:
    branches:
      - main
      - cicd/build

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: abdulari/test:1
      credentials:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: build ui
        run: cd ui && bun install && bun run build

      - name: deploy to gh-pages
        run: |
          git config --global --add safe.directory /__w/react-demo/react-demo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git branch
          git worktree add gh-pages origin/gh-pages
          cd gh-pages && cp -r ../ui/dist/* . && git add . && git commit -m "Update gh-pages" && git push origin HEAD:gh-pages